<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Expense Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before Angular boots so the page doesn't flash the wrong colors.
    try {
      var prefs = JSON.parse(localStorage.getItem('expense-tracker.preferences') || '{}');
      if (prefs.theme) document.documentElement.dataset.theme = prefs.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
