<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Expense Tracker</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b1020;
        color: #8f9bb3;
        font-family: system-ui, 'Segoe UI', sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .logo {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #818cf8, #ec4899);
        color: #fff;
        font-size: 28px;
        font-weight: 800;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(0.92);
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">$</div>
      <div>Starting Expense Tracker…</div>
    </div>
  </body>
</html>
